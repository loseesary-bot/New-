name: Build Nexora Yield APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Add Capacitor & Build
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Nexora Yield" "com.nexorayield.app" --web-dir dist
          npm run build
          npx cap add android
          npx cap copy android

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: NexoraYield-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
